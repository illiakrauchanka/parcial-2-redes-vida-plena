!
version 15.0
service password-encryption
hostname SW-WIFI
!
enable secret VidaPlena#Adm1n
username admin privilege 15 secret VidaPlena#Adm1n
ip domain-name vidaplena.local
no ip domain-lookup
ip ssh version 2
!
banner motd #Acceso restringido - Clinica Vida Plena. Uso no autorizado prohibido.#
!
spanning-tree mode rapid-pvst
!
vlan 90
 name WiFi-Staff
!
vlan 200
 name Infraestructura
!
vlan 300
 name Invitados
!
vlan 999
 name PARKING
!
interface FastEthernet0/1
 description AP-STAFF (SSID VidaPlena-Staff)
 switchport mode access
 switchport access vlan 90
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/2
 description AP-BYOD (SSID VidaPlena-BYOD)
 switchport mode access
 switchport access vlan 300
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/3
 description AP-PACIENTES (SSID VidaPlena-Pacientes)
 switchport mode access
 switchport access vlan 300
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
!
ip dhcp snooping
ip dhcp snooping vlan 90,300
no ip dhcp snooping information option
!
interface GigabitEthernet0/1
 description Uplink a SW-CORE1
 ip dhcp snooping trust
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 90,200,300
 switchport nonegotiate
!
interface GigabitEthernet0/2
 description Uplink a SW-CORE2
 ip dhcp snooping trust
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 90,200,300
 switchport nonegotiate
!
interface range FastEthernet0/4 - 24
 description LIBRE
 switchport mode access
 switchport access vlan 999
 spanning-tree portfast
 spanning-tree bpduguard enable
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
interface Vlan200
 description Gestion
 ip address 10.0.20.204 255.255.255.0
 no shutdown
!
ip default-gateway 10.0.20.254
!
ntp server 10.0.10.10
logging host 10.0.10.10
!
!
line con 0
 login local
 exec-timeout 10 0
!
line vty 0 15
 login local
 transport input ssh
 exec-timeout 10 0
!
end
