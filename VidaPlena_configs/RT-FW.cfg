!
version 15.0
service password-encryption
hostname RT-FW
!
enable secret VidaPlena#Adm1n
username admin privilege 15 secret VidaPlena#Adm1n
ip domain-name vidaplena.local
no ip domain-lookup
ip ssh version 2
!
banner motd #Acceso restringido - Clinica Vida Plena. Uso no autorizado prohibido.#
!
interface FastEthernet0/0
 description WAN ISP1
 ip address 203.0.113.2 255.255.255.252
 ip access-group ACL-WAN-IN in
 ip nat outside
 no shutdown
!
interface FastEthernet0/1
 description LAN a SW-CORE1 VLAN 100
 ip address 10.0.10.250 255.255.255.0
 standby version 2
 standby 1 ip 10.0.10.249
 standby 1 priority 110
 standby 1 preempt
 standby 1 track FastEthernet0/0 20
 ip nat inside
 no shutdown
!
ip access-list standard ACL-NAT
 permit 10.0.0.0 0.0.255.255
!
ip access-list extended ACL-WAN-IN
 remark Solo trafico de retorno y ping de diagnostico
 permit tcp any any established
 permit udp any eq domain any
 permit icmp any any echo-reply
 permit icmp any any unreachable
 permit icmp any any time-exceeded
 deny ip any any
!
ip nat inside source list ACL-NAT interface FastEthernet0/0 overload
!
ip route 10.0.0.0 255.255.0.0 10.0.10.254
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
ntp server 10.0.10.10
logging host 10.0.10.10
!
!
line con 0
 login local
 exec-timeout 10 0
!
line vty 0 15
 login local
 transport input ssh
 exec-timeout 10 0
!
end
