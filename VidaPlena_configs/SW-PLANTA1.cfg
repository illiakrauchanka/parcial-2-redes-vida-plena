interface GigabitEthernet0/1
 description Uplink a SW-CORE1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,60,70,80,100,200
 switchport nonegotiate
!
interface GigabitEthernet0/2
 description Uplink a SW-CORE2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,60,70,80,100,200
 switchport nonegotiate
!
interface range FastEthernet0/17 - 24
 description LIBRE
 switchport mode access
 switchport access vlan 999
 spanning-tree portfast
 spanning-tree bpduguard enable
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
interface Vlan200
 description Gestion
 ip address 10.0.20.201 255.255.255.0
 no shutdown
!
ip default-gateway 10.0.20.254
!
ntp server 10.0.10.10
logging host 10.0.10.10
!
!
line con 0
 login local
 exec-timeout 10 0
!
line vty 0 15
 login local
 transport input ssh
 exec-timeout 10 0
!
end
