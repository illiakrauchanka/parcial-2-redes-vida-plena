!
version 15.0
service password-encryption
hostname SW-PLANTA2
!
enable secret VidaPlena#Adm1n
username admin privilege 15 secret VidaPlena#Adm1n
ip domain-name vidaplena.local
no ip domain-lookup
ip ssh version 2
!
banner motd #Acceso restringido - Clinica Vida Plena. Uso no autorizado prohibido.#
!
spanning-tree mode rapid-pvst
!
vlan 30
 name Guardia
!
vlan 40
 name Consultorios
!
vlan 50
 name Laboratorio
!
vlan 200
 name Infraestructura
!
vlan 999
 name PARKING
!
interface FastEthernet0/1
 description PC-CONSULT1
 switchport mode access
 switchport access vlan 40
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/2
 description PC-CONSULT2
 switchport mode access
 switchport access vlan 40
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/3
 description PC-LAB1
 switchport mode access
 switchport access vlan 50
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/4
 description PC-LAB2
 switchport mode access
 switchport access vlan 50
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/5
 description PC-GUARDIA1
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/6
 description PC-GUARDIA2
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/7
 description IMP-GUARDIA
 switchport mode access
 switchport access vlan 200
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/8
 description IMP-LAB
 switchport mode access
 switchport access vlan 200
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface GigabitEthernet0/1
 description Uplink a SW-CORE1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 30,40,50,200
 switchport nonegotiate
!
interface GigabitEthernet0/2
 description Uplink a SW-CORE2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 30,40,50,200
 switchport nonegotiate
!
interface range FastEthernet0/9 - 24
 description LIBRE
 switchport mode access
 switchport access vlan 999
 spanning-tree portfast
 spanning-tree bpduguard enable
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
interface Vlan200
 description Gestion
 ip address 10.0.20.202 255.255.255.0
 no shutdown
!
ip default-gateway 10.0.20.254
!
ntp server 10.0.10.10
logging host 10.0.10.10
!
!
line con 0
 login local
 exec-timeout 10 0
!
line vty 0 15
 login local
 transport input ssh
 exec-timeout 10 0
!
end
